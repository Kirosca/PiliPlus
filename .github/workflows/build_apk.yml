name: 云端自动打包 APK

on:
  workflow_dispatch: # 支持手动点击按钮触发打包
  push:
    branches: [ main, master ]

jobs:
  android:
    name: 打包 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 安装对应版本的 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 应用 PiliPlus 框架补丁
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: 生成版本信息与编译配置文件
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: 安装项目依赖
        run: flutter pub get

      - name: 打包 release APK
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-标题筛选版-APK
          path: build/app/outputs/flutter-apk/*.apk
