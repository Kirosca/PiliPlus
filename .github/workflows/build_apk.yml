name: 云端打包 APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: 打包 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 安装对应版本的 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 应用 PiliPlus 框架补丁
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: 生成版本信息与编译配置文件
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: 安装项目依赖
        run: flutter pub get

      - name: 打包 release APK
        run: flutter build apk --release --dart-define-from-file=pili_release.json --pub

      - name: 固定密钥签名 APK (支持以后一键覆盖升级免卸载)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        if: ${{ env.SIGNING_KEY != '' }}
        uses: rtrace/android-sign-action@v1
        id: sign_app
        with:
          releaseDirectory: build/app/outputs/flutter-apk
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        continue-on-error: true

      - name: 上传测试安装包 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-Test-APK
          path: build/app/outputs/flutter-apk/*.apk

      - name: 发布到 Releases 页面 (推标签时触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "PiliPlus ${{ github.ref_name }} 标题筛选定制版"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/*.apk
