name: 云端打包 iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  ios:
    name: 打包 iOS IPA
    runs-on: macos-latest

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装对应版本的 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 生成版本信息与编译配置文件
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: 应用 PiliPlus iOS 框架补丁
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: 打包 iOS IPA (含自签证书修补)
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json
          ln -sf ./build/ios/iphoneos Payload
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliPlus_ios.ipa Payload/Runner.app

      - name: 自动合并发布到同一个 Release 页面
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-title-filter
          name: "PiliPlus v2.1.0 标题筛选定制版"
          body: "本版本增加了视频标题关键词严格筛选功能。"
          draft: false
          prerelease: false
          files: PiliPlus_ios.ipa
