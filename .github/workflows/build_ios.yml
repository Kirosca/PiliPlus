name: 云端打包 iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    name: 打包 iOS IPA
    runs-on: macos-latest

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 安装对应版本的 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 应用 PiliPlus 框架补丁
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: 生成版本信息与编译配置文件
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: 安装项目依赖
        run: flutter pub get

      - name: 打包 release iOS
        run: flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --pub

      - name: 生成 IPA 安装包文件
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; 2>/dev/null || true
          zip -r9 PiliPlus_ios.ipa Payload/

      - name: 上传测试安装包 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-Test-IPA
          path: PiliPlus_ios.ipa

      - name: 发布到 Releases 页面 (推标签时触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ github.ref_name }}"
          name: "${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: PiliPlus_ios.ipa
